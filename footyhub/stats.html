<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FootyHub — Stats</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <h1><a href="index.html" class="home-link">FootyHub</a> — Champions League</h1>

  <nav class="tabs">
    <a href="matches.html" class="tab">MATCHES</a>
    <a href="standings.html" class="tab">STANDINGS</a>
    <a href="stats.html" class="tab tab-active">STATS</a>
    <a href="players.html" class="tab">PLAYERS</a>
  </nav>

  <nav class="stat-subtabs">
    <button class="stat-subtab active" data-key="goals">Goals</button>
    <button class="stat-subtab" data-key="assists">Assists</button>
    <button class="stat-subtab" data-key="yellowCards">Yellow Cards</button>
    <button class="stat-subtab" data-key="redCards">Red Cards</button>
  </nav>

  <table id="stats-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Team</th>
        <th id="stat-column-label">Goals</th>
      </tr>
    </thead>
    <tbody id="stats-body">
      <tr><td colspan="4" class="empty-note">Loading...</td></tr>
    </tbody>
  </table>

  <script src="stats.js?v=1"></script>
</body>
</html>
