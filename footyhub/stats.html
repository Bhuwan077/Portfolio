<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FootyHub — Stats</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="ucl-page">
  <div class="bg-slideshow" id="bg-slideshow" aria-hidden="true"></div>

  <h1><a href="index.html" class="home-link">FootyHub</a> — <span id="league-title">Champions League</span></h1>

  <nav class="tabs" id="tabs-nav"></nav>

  <nav class="stat-subtabs">
    <button class="stat-subtab active" data-key="goals">Goals</button>
    <button class="stat-subtab" data-key="assists">Assists</button>
    <button class="stat-subtab" data-key="yellowCards">Yellow Cards</button>
    <button class="stat-subtab" data-key="redCards">Red Cards</button>
  </nav>

  <table id="stats-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Team</th>
        <th id="stat-column-label">Goals</th>
      </tr>
    </thead>
    <tbody id="stats-body">
      <tr><td colspan="4" class="empty-note">Loading...</td></tr>
    </tbody>
  </table>

  <script src="league-tabs.js?v=1"></script>
  <script src="stats.js?v=2"></script>
  <script src="bg-slideshow.js?v=1"></script>
</body>
</html>
