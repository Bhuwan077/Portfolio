<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Football player statistics — top scorers, assists, yellow cards, and red cards for UEFA Champions League &amp; Premier League.">
  <title>FootyHub — Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body class="ucl-page">
  <div class="bg-slideshow" id="bg-slideshow" aria-hidden="true"></div>

  <h1><a href="index.html" class="home-link">FootyHub</a> — <span id="league-title">Champions League</span></h1>

  <nav class="tabs" id="tabs-nav"></nav>

  <nav class="stat-subtabs" id="stat-subtabs">
    <button class="stat-subtab active" data-key="goals">Goals</button>
    <button class="stat-subtab" data-key="assists">Assists</button>
    <button class="stat-subtab" data-key="yellowCards">Yellow Cards</button>
    <button class="stat-subtab" data-key="redCards">Red Cards</button>
  </nav>

  <div class="podium-showcase" id="podium-showcase"></div>

  <table id="stats-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Team</th>
        <th id="stat-column-label">Goals</th>
      </tr>
    </thead>
    <tbody id="stats-body">
      <tr><td colspan="4" class="empty-note">Loading...</td></tr>
    </tbody>
  </table>

  <script src="league-tabs.js?v=6"></script>
  <script src="tilt-3d.js?v=1"></script>
  <script src="stats.js?v=4"></script>
  <script src="bg-slideshow.js?v=4"></script>
</body>
</html>
