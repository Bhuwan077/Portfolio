<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Football squad lists — browse player rosters for UEFA Champions League teams.">
  <title>FootyHub — Players</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body class="ucl-page">
  <div class="bg-slideshow" id="bg-slideshow" aria-hidden="true"></div>

  <h1><a href="index.html" class="home-link">FootyHub</a> — <span id="league-title">Champions League</span></h1>

  <nav class="tabs" id="tabs-nav"></nav>

  <div class="player-filter">
    <select id="team-filter">
      <option value="">All Teams</option>
    </select>
  </div>

  <table id="players-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Position</th>
        <th>Team</th>
      </tr>
    </thead>
    <tbody id="players-body">
      <tr><td colspan="4" class="empty-note">Loading...</td></tr>
    </tbody>
  </table>

  <script src="league-tabs.js?v=3"></script>
  <script src="players.js?v=4"></script>
  <script src="bg-slideshow.js?v=2"></script>
</body>
</html>
