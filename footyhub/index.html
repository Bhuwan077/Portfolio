<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FootyHub — Live football scores, standings, stats, and lineups for UEFA Champions League and Premier League.">
  <title>FootyHub — Live Football Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body class="home-page">
  <main class="hero" role="img" aria-label="An animated nighttime football attack ending with a powerful shot into the upper-right corner of the goal.">
    <canvas aria-hidden="true"></canvas>

    <div class="hero-overlay">
      <h1>FootyHub</h1>
      <p class="subtitle">Pick a competition</p>

      <div class="league-grid">
        <a href="standings.html" class="league-card" id="card-ucl">
          <span class="league-card-icon ucl-icon">
            <svg class="league-svg ucl-svg" viewBox="0 0 32 32" width="28" height="28" fill="none" aria-hidden="true">
              <polygon points="16,3 19,11.5 28,12 21,17.5 23.5,26 16,21 8.5,26 11,17.5 4,12 13,11.5" fill="#ffd54f"/>
              <circle cx="16" cy="16" r="14" stroke="#ffd54f" stroke-width="1.2" stroke-dasharray="3,3" fill="none"/>
              <polygon points="16,1 17,4 20,4 17.5,5.8 18.5,8.5 16,7 13.5,8.5 14.5,5.8 12,4 15,4" fill="#ffffff" opacity="0.9"/>
            </svg>
          </span>
          <span class="league-card-name">UEFA Champions League</span>
        </a>
        <a href="standings.html?league=epl" class="league-card" id="card-epl">
          <span class="league-card-icon epl-icon">♛</span>
          <span class="league-card-name">Premier League</span>
        </a>
        <a href="standings.html?league=laliga" class="league-card" id="card-laliga">
          <span class="league-card-icon laliga-icon">
            <svg class="league-svg laliga-svg" viewBox="0 0 32 32" width="28" height="28" fill="none" aria-hidden="true">
              <path d="M7 6 L13 6 L13 20 L22 20 L22 26 L7 26 Z" fill="#ffffff"/>
              <path d="M15 4 L21 4 L21 15 L27 15 L27 21 L15 21 Z" fill="#ffd700"/>
              <circle cx="27" cy="8.5" r="2.5" fill="#ffffff"/>
            </svg>
          </span>
          <span class="league-card-name">La Liga</span>
        </a>
        <a href="standings.html?league=serieA" class="league-card" id="card-seriea">
          <span class="league-card-icon seriea-icon">
            <svg class="league-svg seriea-svg" viewBox="0 0 32 32" width="28" height="28" fill="none" aria-hidden="true">
              <polygon points="16,3 27,10 24,25 16,30 8,25 5,10" fill="#003399" stroke="#00c6ff" stroke-width="1.4"/>
              <path d="M16 7 L21.5 22 L18.5 22 L17.2 18 L14.8 18 L13.5 22 L10.5 22 Z" fill="#ffffff"/>
              <polygon points="16,11 17.6,15.5 14.4,15.5" fill="#003399"/>
              <rect x="12" y="24" width="2.6" height="2" rx="0.5" fill="#009246"/>
              <rect x="14.7" y="24" width="2.6" height="2" rx="0.5" fill="#ffffff"/>
              <rect x="17.4" y="24" width="2.6" height="2" rx="0.5" fill="#ce2b37"/>
            </svg>
          </span>
          <span class="league-card-name">Serie A</span>
        </a>
        <a href="standings.html?league=bundesliga" class="league-card" id="card-bundesliga">
          <span class="league-card-icon bundesliga-icon">
            <svg class="league-svg bundesliga-svg" viewBox="0 0 32 32" width="28" height="28" fill="none" aria-hidden="true">
              <circle cx="11" cy="9.5" r="2.2" fill="#ffffff"/>
              <path d="M12 11.5 L18 16 L16 21 L10 15.5 Z" fill="#ffffff"/>
              <path d="M17 16 L24 13 L23 11 L16 14 Z" fill="#ffffff"/>
              <path d="M11 16.5 L6.5 20.5 L7.5 22.5 L13 18.5 Z" fill="#ffffff"/>
              <path d="M13 12.5 L10 8 L8.5 9 L11 13.5 Z" fill="#ffffff"/>
              <circle cx="26" cy="9.5" r="2.8" fill="#ffffff"/>
              <polygon points="26,8 27.5,9 27,10.5 25,10.5 24.5,9" fill="#d3010c"/>
              <line x1="21.5" y1="7" x2="23.5" y2="8" stroke="#ffcc00" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="league-card-name">Bundesliga</span>
        </a>
      </div>
    </div>

    <!-- Free-floating interactive 3D football (draggable anywhere) -->
    <canvas id="ball-3d-canvas" width="90" height="90" aria-label="Interactive 3D Football"></canvas>
  </main>

  <script src="tilt-3d.js?v=1"></script>
  <script src="hero-animation.js?v=2"></script>
  <script src="ball-3d.js?v=5"></script>
</body>
</html>
