<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FootyHub</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main class="hero" role="img" aria-label="An animated nighttime football attack ending with a powerful shot into the upper-right corner of the goal.">

    <div class="hero-overlay">
      <h1>FootyHub</h1>
      <p class="subtitle">Pick a competition</p>

      <div class="league-grid">
        <a href="standings.html" class="league-card">UEFA Champions League</a>

        <div class="league-card league-card-disabled">Premier League<span class="soon-badge">Coming soon</span></div>
        <div class="league-card league-card-disabled">Serie A<span class="soon-badge">Coming soon</span></div>
        <div class="league-card league-card-disabled">Bundesliga<span class="soon-badge">Coming soon</span></div>
      </div>
    </div>
  </main>

  <script src="hero-animation.js?v=2"></script>

</html>
