<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FootyHub — UCL Matches</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="ucl-page">
  <div class="bg-slideshow" aria-hidden="true">
  <div class="bg-slide active" style="background-image:url('images/ucl-bg-1.jpg')"></div>
  <div class="bg-slide" style="background-image:url('images/ucl-bg-2.webp')"></div>
  <div class="bg-slide" style="background-image:url('images/ucl-bg-3.jpeg')"></div>
</div>
  <h1><a href="index.html" class="home-link">FootyHub</a> — Champions League</h1>

  <nav class="tabs">
    <a href="matches.html" class="tab tab-active">MATCHES</a>
    <a href="standings.html" class="tab">STANDINGS</a>
    <a href="stats.html" class="tab">STATS</a>
    <a href="players.html" class="tab">PLAYERS</a>
  </nav>

  <div id="live-section" style="display:none;">
    <h2 class="section-heading">Live Now</h2>
    <div class="match-list" id="live-list"></div>
  </div>

  <button id="results-toggle" class="section-toggle" type="button">
    <span>Results</span>
    <span id="results-arrow" class="arrow">&#9660;</span>
  </button>
  <div class="results-grid collapsed" id="finished-list"></div>

  <h2 class="section-heading">Upcoming Fixtures</h2>
  <div class="match-list" id="upcoming-list">
    <p class="empty-note">Loading...</p>
  </div>

  <script src="matches.js?v=4"></script>
  <script src="bg-slideshow.js?v=1"></script>
</body>
</html>
