<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Live and upcoming football matches — UEFA Champions League &amp; Premier League fixtures, scores, and results.">
  <title>FootyHub — Matches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body class="ucl-page">
  <div class="bg-slideshow" id="bg-slideshow" aria-hidden="true"></div>

  <h1><a href="index.html" class="home-link">FootyHub</a> — <span id="league-title">Champions League</span></h1>

  <nav class="tabs" id="tabs-nav"></nav>

  <div id="live-section" style="display:none;">
    <h2 class="section-heading">Live Now</h2>
    <div class="match-list" id="live-list"></div>
  </div>

  <button id="results-toggle" class="section-toggle" type="button">
    <span>Results</span>
    <span id="results-arrow" class="arrow">&#9660;</span>
  </button>
  <div class="results-grid collapsed" id="finished-list"></div>

  <h2 class="section-heading">Upcoming Fixtures</h2>
  <div class="match-list" id="upcoming-list">
    <p class="empty-note">Loading...</p>
  </div>

  <script src="league-tabs.js?v=4"></script>
  <script src="matches.js?v=5"></script>
  <script src="bg-slideshow.js?v=3"></script>
</body>
</html>
