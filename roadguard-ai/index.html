<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RoadGuard AI</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css?v=7" />
</head>
<body>

<div id="hero">
  <svg id="hero-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#14101f"/>
        <stop offset="45%" stop-color="#4a2545"/>
        <stop offset="78%" stop-color="#c85a3c"/>
        <stop offset="100%" stop-color="#f4a24a"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffcf7a" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#ffcf7a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2c2e33"/>
        <stop offset="100%" stop-color="#1c1d20"/>
      </linearGradient>
      <linearGradient id="scrimGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#000" stop-opacity="0.55"/>
        <stop offset="30%" stop-color="#000" stop-opacity="0"/>
        <stop offset="62%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
      </linearGradient>
      <filter id="softBlur"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>

    <rect width="1000" height="600" fill="url(#skyGrad)"/>
    <circle cx="770" cy="330" r="90" fill="url(#sunGlow)"/>
    <circle cx="770" cy="330" r="40" fill="#ffcf7a"/>

    <path d="M0,400 Q160,350 320,390 T640,375 T1000,392 L1000,600 L0,600 Z" fill="#20182a" opacity="0.85"/>
    <path d="M0,430 Q220,380 440,415 T900,405 L1000,420 L1000,600 L0,600 Z" fill="#161020"/>

    <rect y="420" width="1000" height="180" fill="url(#roadGrad)"/>
    <line x1="0" y1="420" x2="1000" y2="420" stroke="#3a3c40" stroke-width="2"/>
    <line id="lane-line" x1="0" y1="490" x2="1000" y2="490" stroke="#F5C518" stroke-width="5" stroke-dasharray="40 30"/>

    <g id="pothole-group">
      <ellipse cx="520" cy="498" rx="28" ry="11" fill="#0a0b0c"/>
      <ellipse cx="520" cy="498" rx="28" ry="11" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
      <rect id="detect-box" x="478" y="462" width="84" height="70" rx="8" fill="none" stroke="#E4572E" stroke-width="3" opacity="0"/>
      <text id="detect-label" x="520" y="452" text-anchor="middle" font-family="Oswald, sans-serif" font-size="18" font-weight="700" fill="#E4572E" opacity="0">POTHOLE DETECTED</text>
    </g>

    <g id="destination">
      <line x1="945" y1="428" x2="945" y2="500" stroke="#9A9CA1" stroke-width="4"/>
      <path d="M945,428 L995,440 L945,452 Z" fill="#F5C518"/>
      <path d="M945,428 L970,434 L945,440 Z" fill="#1C1D20"/>
    </g>

    <g id="road-offset" transform="translate(0,405)">
      <g id="car-group">
        <g id="car-bounce">
          <ellipse cx="55" cy="72" rx="52" ry="6" fill="#000" opacity="0.3"/>
          <rect x="6" y="32" width="98" height="32" rx="12" fill="#F5C518"/>
          <path d="M25 32 Q35 6 54 6 H73 Q89 6 96 32 Z" fill="#F5C518"/>
          <path d="M30 29 Q38 13 54 13 H72 Q84 13 90 29 Z" fill="#1C1D20" opacity="0.55"/>
          <circle cx="12" cy="32" r="4" fill="#fff8e0"/>
          <circle cx="12" cy="32" r="8" fill="#fff8e0" opacity="0.3" filter="url(#softBlur)"/>
          <g class="wheel" style="transform-origin: 26px 64px;">
            <circle cx="26" cy="64" r="11" fill="#141517"/>
            <circle cx="26" cy="64" r="4" fill="#555"/>
          </g>
          <g class="wheel" style="transform-origin: 86px 64px;">
            <circle cx="86" cy="64" r="11" fill="#141517"/>
            <circle cx="86" cy="64" r="4" fill="#555"/>
          </g>
        </g>
      </g>
    </g>

    <rect width="1000" height="600" fill="url(#scrimGrad)"/>
  </svg>

  <div id="hero-text">
    <h1>RoadGuard AI</h1>
    <p>AI-powered road damage detection & mapping</p>
  </div>

  <div id="cards">
    <a class="card" href="upload.html">
      <div class="icon">📷</div>
      <h2>Upload a Photo</h2>
      <p>Pick a spot on the map and upload a photo of a pothole or crack to check its severity.</p>
    </a>

    <a class="card" href="capture.html">
      <div class="icon">🚗</div>
      <h2>Driving Mode</h2>
      <p>Opens your camera and GPS, and auto-detects road damage as you drive or walk.</p>
    </a>

    <a id="dashboard-link" href="dashboard.html">View Live Dashboard & Map →</a>
  </div>
</div>

</body>
</html>
